<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRAAP-test: beoordeel je bron</title>
<style>
:root{--blauw:#00283c;--or:#fa6432;--osoft:#ffe2d4;--zb:#e6f0ff;--body:#33404f;--mut:#5c6b7a;--line:#d8dde3;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--blauw);font-family:-apple-system,"Segoe UI",Arial,Helvetica,sans-serif}
.wrap{font-size:clamp(14px,1.3vw,19px);max-width:1500px;margin:0 auto;padding:1.4em 1.1em 2em}
.box{background:#f2f5f8;border:1px solid var(--line);border-radius:.8em;padding:1.1em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14em,1fr));gap:.9em;align-items:stretch}
.card{background:#fff;border:1px solid var(--line);border-top:.4em solid var(--blauw);border-radius:.7em;box-shadow:0 1px 3px rgba(0,40,60,.08);overflow:hidden;display:flex;flex-direction:column}
.card.open{grid-column:1/-1;border-color:var(--or);border-top-color:var(--blauw)}
.card button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:.8em;padding:1em 1.1em;color:var(--blauw);flex:1 1 auto;min-height:5.5em}
.card button>span:first-child{flex:1;min-width:0}
.card button:hover{background:var(--osoft)}
.card button:focus-visible{outline:3px solid var(--or);outline-offset:-3px}
.t{display:flex;align-items:center;font-weight:700;font-size:1.1em;line-height:1.3}
.bd{flex:none;width:1.9em;height:1.9em;border:2px solid var(--blauw);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:Georgia,serif;margin-right:.6em}
.card.open .bd{background:var(--osoft);border-color:var(--or)}
.s{display:block;margin:.3em 0 0 2.9em;color:var(--mut);font-size:.9em;line-height:1.4}
.pm{color:var(--or);font-size:1.5em;line-height:1;flex:none}
.body{display:none;padding:0 1.1em 1.1em}
.card.open .body{display:block}
.body ul{margin:0 0 1em;padding-left:1.2em;color:var(--body);line-height:1.55}
.body li{margin-bottom:.4em}.body li::marker{color:var(--or)}
.body mark{background:#fbeeb8;color:inherit;padding:0 .15em;border-radius:.2em}
.k{background:var(--zb);border-radius:.5em;padding:.7em 1em;font-weight:600;color:var(--blauw)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><div class="box"><div class="grid" id="g"></div></div></div>
<script>
var C=[
{l:"C",i:,t:"Currency – Actualiteit""⏳",b:["Wanneer werd de informatie gepubliceerd of aangepast?","Is de informatie actueel genoeg voor jouw onderwerp?","Zijn er recentere bronnen of ontwikkelingen?"]},
{l:"R",i:"🎯",t:"Relevance – Relevantie",b:["Sluit de informatie aan bij jouw onderzoeksvraag?","Voor wie is de informatie bedoeld, en past het niveau bij jouw opdracht?","Is dit de beste bron voor je vraag, of zijn er betere?"]},
{l:"A",i:"✅",t:"Accuracy – Accuraatheid",b:["Is de informatie waar, correct en betrouwbaar?","Wordt de informatie ondersteund met bewijsmateriaal?","Wordt er verwezen naar gebruikte bronnen?"]},
{l:"A",i:"✍️",t:"Author – Auteur",b:["Wie is de auteur? Is dit een autoriteit ter zake?","Waaruit blijkt dat hij een expert is op dit gebied?","Wat zeggen andere bronnen over deze auteur?","Werkt die persoon voor een betrouwbare organisatie?"]},
{l:"P",i:"📢",t:"Purpose – Doel",b:["Wat is het doel van de informatie? Informeren, overtuigen, entertainen?","Is de auteur duidelijk over dit doel?","Worden er feiten meegedeeld? Of zijn het opinies?"]}
];

var g=document.getElementById("g");
C.forEach(function(c){
  var d=document.createElement("div");d.className="card";
  d.innerHTML="<button type='button' aria-expanded='false'><span><span class='t'><span class='bd' aria-hidden='true'>"+c.l+"</span><span aria-hidden='true' style='margin-right:.4em'>"+c.i+"</span>"+c.t+"</span></span><span class='pm' aria-hidden='true'>+</span></button>"+
  "<div class='body'><ul>"+c.b.map(function(x){return"<li>"+x+"</li>"}).join("")+"</ul></div>";
  var b=d.querySelector("button"),pm=d.querySelector(".pm");
  b.addEventListener("click",function(){var o=d.classList.toggle("open");b.setAttribute("aria-expanded",o);pm.textContent=o?"\u2212":"+"});
  g.appendChild(d);
});
</script>
</body>
</html>
